<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عيد ليلى</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0708;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية ===== */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(200, 120, 150, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(180, 100, 140, 0.04), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== البطاقة ===== */
        .card {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            padding: 55px 35px 45px;
            background: rgba(15, 10, 13, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            border: 1px solid rgba(200, 150, 170, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 80px rgba(200, 120, 150, 0.02);
        }

        /* ===== نجمتان ترمشان ===== */
        .twinkling-stars {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 2;
        }

        .star-twinkle {
            font-size: 0.6rem;
            color: rgba(230, 200, 215, 0.15);
            animation: twinkle 2.8s ease-in-out infinite;
            letter-spacing: 0;
            line-height: 1;
        }

        .star-twinkle:nth-child(1) {
            animation-delay: 0s;
        }
        .star-twinkle:nth-child(2) {
            animation-delay: 1.4s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.08;
                transform: scale(0.6);
                text-shadow: 0 0 2px rgba(200, 150, 170, 0.02);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.3);
                text-shadow: 0 0 12px rgba(200, 150, 170, 0.08);
            }
        }

        /* ===== مكان الصورة فارغ ===== */
        .image-wrap {
            width: 120px;
            height: 120px;
            margin: 30px auto 20px;
            border-radius: 50%;
            border: 1.5px solid rgba(200, 150, 170, 0.08);
            padding: 5px;
            position: relative;
        }

        .image-wrap .empty {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(30, 18, 25, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            color: rgba(200, 150, 170, 0.06);
            font-weight: 100;
            letter-spacing: 2px;
        }

        .image-caption {
            text-align: center;
            font-size: 0.55rem;
            color: rgba(200, 150, 170, 0.04);
            letter-spacing: 6px;
            margin-top: -18px;
            margin-bottom: 20px;
            font-weight: 100;
        }

        /* ===== الاسم ===== */
        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            font-weight: 600;
            text-align: center;
            color: rgba(230, 200, 215, 0.8);
            letter-spacing: 2px;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .name-sub {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(200, 150, 170, 0.2);
            letter-spacing: 8px;
            font-weight: 300;
            margin-bottom: 25px;
        }

        /* ===== الفاصل ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 8px 0 22px;
        }
        .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(200, 150, 170, 0.06), transparent);
        }
        .divider .icon {
            color: rgba(200, 150, 170, 0.06);
            font-size: 0.5rem;
        }

        /* ===== النص ===== */
        .message {
            font-family: 'Tajawal', sans-serif;
            font-weight: 300;
            font-size: 1.05rem;
            line-height: 2.3;
            text-align: right;
            color: rgba(220, 200, 210, 0.65);
            direction: rtl;
            padding: 5px 0;
        }

        .message .highlight {
            color: rgba(230, 180, 200, 0.45);
            font-weight: 400;
        }

        .message .pink {
            color: rgba(220, 150, 180, 0.3);
            font-weight: 300;
        }

        /* ===== التذييل ===== */
        .footnote {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(200, 150, 170, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(200, 150, 170, 0.08);
            letter-spacing: 4px;
        }

        .footnote .sign {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: rgba(200, 150, 170, 0.08);
            letter-spacing: 3px;
            font-weight: 300;
            transition: all 3s ease;
        }

        .footnote .sign:hover {
            color: rgba(200, 150, 170, 0.15);
        }

        /* ===== تفاصيل ===== */
        .detail-top {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 0.4rem;
            color: rgba(200, 150, 170, 0.03);
            letter-spacing: 10px;
            writing-mode: vertical-rl;
        }

        .detail-bottom {
            position: absolute;
            bottom: 18px;
            left: 22px;
            font-size: 0.4rem;
            color: rgba(200, 150, 170, 0.02);
            letter-spacing: 8px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        /* ===== نقطة تتحرك ===== */
        .surprise-dot {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(200, 150, 170, 0.06);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: wander 25s linear infinite;
        }

        @keyframes wander {
            0% { top: 10%; left: 10%; opacity: 0; }
            15% { opacity: 0.4; }
            35% { top: 75%; left: 85%; }
            55% { top: 25%; left: 10%; }
            75% { top: 85%; left: 5%; }
            90% { top: 15%; left: 92%; }
            100% { top: 10%; left: 10%; opacity: 0; }
        }

        .surprise-dot-2 {
            animation-duration: 35s;
            animation-delay: 4s;
            width: 1.5px;
            height: 1.5px;
        }

        /* ===== نص يظهر متأخراً ===== */
        .late-text {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 0;
            opacity: 0;
            animation: appearLate 12s ease 6s forwards;
            font-family: 'Dancing Script', cursive;
            color: rgba(200, 150, 170, 0.025);
            font-size: 1rem;
            letter-spacing: 6px;
        }

        @keyframes appearLate {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== توافق ===== */
        @media (max-width: 420px) {
            .card { padding: 35px 20px 30px; }
            .name { font-size: 2.4rem; }
            .image-wrap { width: 90px; height: 90px; }
            .image-wrap .empty { font-size: 1.6rem; }
            .message { font-size: 0.95rem; }
            .twinkling-stars { top: 16px; gap: 14px; }
            .star-twinkle { font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- خلفية -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- نقاط -->
    <div class="surprise-dot"></div>
    <div class="surprise-dot surprise-dot-2"></div>

    <!-- نص متأخر -->
    <div class="late-text">ليلى</div>

    <!-- ===== البطاقة ===== -->
    <div class="card">

        <!-- نجمتان ترمشان -->
        <div class="twinkling-stars">
            <span class="star-twinkle">✦</span>
            <span class="star-twinkle">✦</span>
        </div>

        <div class="detail-top">· ·</div>
        <div class="detail-bottom">· ·</div>

        <!-- مكان الصورة فارغ -->
        <div class="image-wrap">
            <div class="empty">✦</div>
        </div>
        <div class="image-caption">· · ·</div>

        <!-- الاسم -->
        <div class="name">ليلى</div>
        <div class="name-sub">· عيد ميلادك ·</div>

        <div class="divider">
            <span class="line"></span>
            <span class="icon">◆</span>
            <span class="line"></span>
        </div>

        <!-- الرسالة -->
        <div class="message">
            <span class="highlight">كل سنة</span> وإنتِ بألف خير<br />
            <span class="pink">أتمنى لكِ</span> سنة أجمل من اللي فاتت<br />
            <span class="highlight">وأنتِ تستحقين</span> كل الحب<br />
            <span class="pink" style="font-size:0.9rem;">🌸</span>
        </div>

        <!-- التذييل -->
        <div class="footnote">
            <span class="sign">من فارس... لليلى</span>
        </div>

    </div>

</body>
</html>
