<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 عيد ميلاد ليلى</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 30%, #2a1a2e, #0f0a11 75%);
            position: relative;
            overflow: hidden;
        }

        /* خلفية حية ولكنها ليست سوداء */
        .bg-glow {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(180, 80, 120, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowMove 15s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(140, 60, 140, 0.10), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowMove 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes glowMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* البطاقة - جديدة وجذابة */
        .card {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            padding: 50px 35px 40px;
            background: rgba(28, 18, 30, 0.65);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border-radius: 48px;
            border: 1px solid rgba(255, 200, 220, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 200, 220, 0.03) inset, 0 0 80px rgba(180, 80, 120, 0.04);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 200, 220, 0.06) inset, 0 0 100px rgba(180, 80, 120, 0.08);
        }

        /* نجمتان ترمشان - أكثر وضوحاً */
        .twinkling-stars {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        .star-twinkle {
            font-size: 0.9rem;
            color: rgba(255, 210, 230, 0.3);
            animation: twinkle 2.8s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 180, 210, 0.05);
        }

        .star-twinkle:nth-child(1) {
            animation-delay: 0s;
        }
        .star-twinkle:nth-child(2) {
            animation-delay: 1.4s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.1;
                transform: scale(0.6);
                text-shadow: 0 0 5px rgba(255, 180, 210, 0.02);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.3);
                text-shadow: 0 0 25px rgba(255, 180, 210, 0.15);
            }
        }

        /* مكان الصورة - أنيق وهادئ */
        .image-wrap {
            width: 110px;
            height: 110px;
            margin: 20px auto 25px;
            border-radius: 50%;
            border: 1px solid rgba(255, 200, 220, 0.06);
            padding: 4px;
        }

        .image-wrap .empty {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(40, 25, 40, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            color: rgba(255, 200, 220, 0.04);
        }

        /* الاسم */
        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            font-weight: 600;
            text-align: center;
            color: rgba(245, 220, 235, 0.85);
            letter-spacing: 1px;
            margin-bottom: 4px;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(200, 120, 160, 0.05);
        }

        .name-sub {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(200, 150, 180, 0.3);
            letter-spacing: 10px;
            font-weight: 300;
            margin-bottom: 25px;
        }

        /* الفاصل */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 8px 0 25px;
        }
        .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 200, 220, 0.08), transparent);
        }
        .divider .icon {
            color: rgba(255, 200, 220, 0.05);
            font-size: 0.6rem;
        }

        /* النص - أكثر وضوحاً */
        .message {
            font-family: 'Tajawal', sans-serif;
            font-weight: 300;
            font-size: 1.15rem;
            line-height: 2.4;
            text-align: right;
            color: rgba(235, 210, 225, 0.8);
            direction: rtl;
            padding: 5px 0;
        }

        .message .highlight {
            color: rgba(235, 180, 210, 0.6);
            font-weight: 400;
        }

        .message .pink {
            color: rgba(220, 150, 190, 0.4);
            font-weight: 300;
        }

        /* التوقيع - همسة مقروءة */
        .footnote {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 200, 220, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footnote .sign {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: rgba(200, 150, 180, 0.12);
            letter-spacing: 2px;
            font-weight: 300;
            transition: color 0.6s ease;
        }

        .footnote .sign:hover {
            color: rgba(200, 150, 180, 0.25);
        }

        /* عناصر جانبية بسيطة */
        .detail-corner {
            position: absolute;
            font-size: 0.4rem;
            color: rgba(255, 200, 220, 0.02);
            letter-spacing: 6px;
        }
        .detail-corner.top-right {
            top: 20px;
            right: 25px;
            writing-mode: vertical-rl;
        }
        .detail-corner.bottom-left {
            bottom: 20px;
            left: 25px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        /* جسيمات خفيفة جداً */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(255, 200, 220, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatParticle 20s linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        /* توافق الجوال */
        @media (max-width: 420px) {
            .card { padding: 35px 20px 30px; }
            .name { font-size: 2.6rem; }
            .image-wrap { width: 90px; height: 90px; }
            .image-wrap .empty { font-size: 2rem; }
            .message { font-size: 1rem; }
            .twinkling-stars { top: 14px; gap: 14px; }
            .star-twinkle { font-size: 0.7rem; }
            .footnote .sign { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- خلفية حية -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- جسيمات -->
    <div class="particle" style="--tx: 100px; --ty: 300px; left: 5%; top: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="--tx: -80px; --ty: 200px; left: 90%; top: 70%; animation-delay: 5s;"></div>
    <div class="particle" style="--tx: 150px; --ty: -150px; left: 20%; top: 80%; animation-delay: 10s;"></div>

    <!-- ===== البطاقة ===== -->
    <div class="card">

        <!-- نجمتان ترمشان -->
        <div class="twinkling-stars">
            <span class="star-twinkle">✦</span>
            <span class="star-twinkle">✦</span>
        </div>

        <div class="detail-corner top-right">· ·</div>
        <div class="detail-corner bottom-left">· ·</div>

        <!-- الصورة -->
        <div class="image-wrap">
            <div class="empty">✦</div>
        </div>

        <!-- الاسم -->
        <div class="name">ليلى</div>
        <div class="name-sub">· عيد ميلادك ·</div>

        <div class="divider">
            <span class="line"></span>
            <span class="icon">◆</span>
            <span class="line"></span>
        </div>

        <!-- الرسالة -->
        <div class="message">
            <span class="highlight">كل سنة</span> وإنتِ بألف خير<br />
            <span class="pink">أتمنى لكِ</span> سنة أجمل من اللي فاتت<br />
            <span class="highlight">وأنتِ تستحقين</span> كل الحب<br />
            <span class="pink" style="font-size:0.9rem;">🌸</span>
        </div>

        <!-- التذييل -->
        <div class="footnote">
            <span class="sign">من فارس... لليلى</span>
        </div>

    </div>

</body>
</html>
