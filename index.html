<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ليلى...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
            overflow: hidden;
            cursor: default;
        }

        /* الطبقة الرئيسية */
        .stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* ===== المشهد الأول: "ليلى..." ===== */
        .scene-1 {
            position: absolute;
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 100;
            color: rgba(255, 182, 193, 0.08);
            letter-spacing: 15px;
            animation: appearName 4s ease forwards;
            text-shadow: 0 0 60px rgba(255, 182, 193, 0.02);
            font-family: 'Georgia', serif;
        }
        @keyframes appearName {
            0% { opacity: 0; transform: scale(0.6); letter-spacing: 40px; }
            40% { opacity: 1; transform: scale(1.05); letter-spacing: 12px; color: rgba(255, 182, 193, 0.25); }
            60% { opacity: 1; transform: scale(0.98); letter-spacing: 15px; color: rgba(255, 182, 193, 0.2); }
            100% { opacity: 0.15; transform: scale(0.95); letter-spacing: 18px; color: rgba(255, 182, 193, 0.06); }
        }

        /* ===== المشهد الثاني: "عيدك اليوم..." ===== */
        .scene-2 {
            position: absolute;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 100;
            color: rgba(255, 210, 220, 0.06);
            letter-spacing: 20px;
            opacity: 0;
            animation: appearSecond 5s ease 3s forwards;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 80px rgba(255, 182, 193, 0.01);
        }
        @keyframes appearSecond {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); letter-spacing: 40px; }
            30% { opacity: 0.6; transform: translateY(0) scale(1); letter-spacing: 12px; color: rgba(255, 210, 220, 0.12); }
            60% { opacity: 0.4; transform: translateY(-5px) scale(0.98); letter-spacing: 18px; }
            100% { opacity: 0.08; transform: translateY(0) scale(0.95); letter-spacing: 22px; color: rgba(255, 210, 220, 0.04); }
        }

        /* ===== النجوم ===== */
        .stars-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star-dot {
            position: absolute;
            border-radius: 50%;
            background: white;
            transition: all 3s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
        }

        /* ===== القلب النجمي ===== */
        .heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: heartReveal 6s ease 6s forwards;
        }
        @keyframes heartReveal {
            0% { opacity: 0; }
            40% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .heart-shape {
            position: relative;
            width: clamp(180px, 40vw, 350px);
            height: clamp(180px, 40vw, 350px);
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            top: 0;
            width: 52%;
            height: 80%;
            border-radius: 50% 50% 0 0;
            background: radial-gradient(circle at center, rgba(255, 182, 193, 0.12), rgba(255, 182, 193, 0.02));
            animation: heartPulse 4s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(255, 182, 193, 0.03);
        }
        .heart-shape::before {
            left: 0;
            transform: rotate(-45deg);
            transform-origin: bottom right;
        }
        .heart-shape::after {
            right: 0;
            transform: rotate(45deg);
            transform-origin: bottom left;
        }
        .heart-shape .center-glow {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.15), transparent 70%);
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        /* ===== الجملة الأخيرة ===== */
        .final-words {
            position: fixed;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-family: 'Georgia', serif;
            font-size: clamp(1.2rem, 3.5vw, 2.4rem);
            font-weight: 100;
            color: rgba(255, 200, 210, 0.04);
            letter-spacing: 6px;
            opacity: 0;
            animation: finalAppear 7s ease 9s forwards;
            text-align: center;
            line-height: 2.2;
            text-shadow: 0 0 40px rgba(255, 182, 193, 0.01);
            direction: rtl;
        }
        @keyframes finalAppear {
            0% { opacity: 0; transform: translateX(-50%) translateY(30px); letter-spacing: 20px; }
            25% { opacity: 0.4; transform: translateX(-50%) translateY(0); letter-spacing: 4px; color: rgba(255, 200, 210, 0.08); }
            60% { opacity: 0.3; transform: translateX(-50%) translateY(-3px); }
            100% { opacity: 0.06; transform: translateX(-50%) translateY(0); letter-spacing: 8px; color: rgba(255, 200, 210, 0.03); }
        }

        /* ===== وميض خفيف جداً ===== */
        .flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 182, 193, 0.01), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: flickerAnim 8s ease-in-out infinite;
        }
        @keyframes flickerAnim {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.4; }
        }

        /* ===== لا شيء آخر ===== */
        .nothing {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.008);
            font-size: 0.5rem;
            letter-spacing: 10px;
            font-family: 'Georgia', serif;
            z-index: 0;
            animation: nothingFade 15s ease 12s forwards;
        }
        @keyframes nothingFade {
            0% { opacity: 0; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- المشهد الأول -->
        <div class="scene-1">ليلى...</div>

        <!-- المشهد الثاني -->
        <div class="scene-2">عيدك اليوم...</div>

        <!-- طبقة النجوم -->
        <div class="stars-layer" id="starsLayer"></div>

        <!-- القلب النجمي -->
        <div class="heart-container" id="heartContainer">
            <div class="heart-shape">
                <div class="center-glow"></div>
            </div>
        </div>

        <!-- الجملة الأخيرة -->
        <div class="final-words" id="finalWords">
            وكل شيء حولي<br />يذكرني بكِ
        </div>

        <!-- وميض خفيف -->
        <div class="flicker"></div>

        <!-- لا شيء -->
        <div class="nothing">· · ·</div>
    </div>

    <script>
        // ============================================================
        // 1. إنشاء النجوم
        // ============================================================
        function createStars() {
            const layer = document.getElementById('starsLayer');
            const count = 180;
            const positions = [];

            // نجوم عشوائية
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star-dot';
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.background = `rgba(255, ${200 + Math.random() * 55}, ${210 + Math.random() * 45}, 0.6)`;
                star.style.boxShadow = `0 0 ${size * 3}px rgba(255, 182, 193, 0.1)`;
                star.dataset.x = parseFloat(star.style.left);
                star.dataset.y = parseFloat(star.style.top);
                layer.appendChild(star);
                positions.push({ x: parseFloat(star.style.left), y: parseFloat(star.style.top), el: star });
            }

            return positions;
        }

        const stars = createStars();

        // ============================================================
        // 2. تحويل النجوم إلى قلب
        // ============================================================
        function formHeart() {
            const starEls = document.querySelectorAll('.star-dot');
            const count = starEls.length;
            const used = Math.min(count, 140);

            // معادلة القلب: x = 16 sin³(t), y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
            // نأخذ فقط النجوم التي ستتحرك
            const indices = [];
            for (let i = 0; i < used; i++) {
                indices.push(i);
            }
            // نخلطهم عشان نختار عشوائي
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            const selected = indices.slice(0, used);

            const centerX = 50;
            const centerY = 45;
            const scale = Math.min(window.innerWidth, window.innerHeight) / 320;

            selected.forEach((idx, i) => {
                const el = starEls[idx];
                if (!el) return;

                const t = (i / used) * 2 * Math.PI;
                // معادلة القلب
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                const posX = centerX + (x * scale * 0.7);
                const posY = centerY - (y * scale * 0.7);

                // تأخير متدرج
                const delay = (i / used) * 3.5 + 5.5;

                setTimeout(() => {
                    el.style.left = posX + '%';
                    el.style.top = posY + '%';
                    el.style.opacity = '1';
                    el.style.transition = 'all 2.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.style.background = `rgba(255, ${180 + Math.random() * 75}, ${200 + Math.random() * 55}, ${0.5 + Math.random() * 0.5})`;
                    el.style.boxShadow = `0 0 ${6 + Math.random() * 12}px rgba(255, 182, 193, ${0.1 + Math.random() * 0.2})`;
                    el.style.width = (Math.random() * 3 + 1.5) + 'px';
                    el.style.height = el.style.width;
                }, delay * 1000);
            });

            // النجوم الباقية تتلاشى
            starEls.forEach((el, i) => {
                if (!selected.includes(i)) {
                    setTimeout(() => {
                        el.style.opacity = '0';
                        el.style.transition = 'opacity 2s ease';
                    }, 6000);
                }
            });
        }

        // ============================================================
        // 3. تشغيل التسلسل
        // ============================================================
        setTimeout(() => {
            formHeart();
        }, 500);

        // ============================================================
        // 4. إعادة تشغيل تلقائي بعد 25 ثانية (للإعجاب)
        // ============================================================
        setTimeout(() => {
            location.reload();
        }, 28000);

        // ============================================================
        // 5. كونسول صامت
        // ============================================================
        console.log('·');
        console.log('· ·');
        console.log('· · ·');
        console.log('%cليلى...', 'font-size:30px; color:#ffb6c1; font-weight:100; letter-spacing:10px;');
        console.log('%cعيدك اليوم', 'font-size:18px; color:#ffb6c1; font-weight:100; letter-spacing:8px; opacity:0.5;');
        console.log('%cوكل شيء حولي يذكرني بكِ', 'font-size:14px; color:#ffb6c1; font-weight:100; letter-spacing:4px; opacity:0.3;');
    </script>
</body>
</html>
