<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎉 عيد سعيد يا ليلى</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0610;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* ===== الخلفية المتحركة ===== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 50, 120, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(200, 80, 120, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(80, 30, 100, 0.4) 0%, transparent 50%),
                #0a0610;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ===== النجوم ===== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== الشهب ===== */
        .shooting-star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            z-index: 0;
            animation: shoot linear forwards;
            box-shadow: 0 0 20px 5px rgba(255, 200, 255, 0.3);
        }
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 80px;
            height: 2px;
            background: linear-gradient(to left, rgba(255, 200, 255, 0.8), transparent);
            transform: translateY(-50%);
            border-radius: 50%;
        }
        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(var(--angle)); opacity: 0; }
            5% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(600px, 600px) rotate(var(--angle)); opacity: 0; }
        }

        /* ===== البطاقة الرئيسية ===== */
        .card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            padding: 50px 40px;
            background: rgba(20, 12, 30, 0.75);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-radius: 50px;
            border: 1px solid rgba(255, 182, 193, 0.15);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 182, 193, 0.05) inset,
                0 0 80px rgba(255, 182, 193, 0.05);
            transform-style: preserve-3d;
            perspective: 800px;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            animation: cardFloat 6s ease-in-out infinite;
        }
        .card:hover {
            transform: rotateY(2deg) rotateX(2deg) scale(1.02);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.9),
                0 0 0 2px rgba(255, 182, 193, 0.1) inset,
                0 0 120px rgba(255, 182, 193, 0.08);
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* ===== الهيدر ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header .emoji-deco {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: emojiDance 3s ease-in-out infinite;
        }
        @keyframes emojiDance {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffb6c1, #ff6b8a, #ffb6c1);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(255, 107, 138, 0.2);
            letter-spacing: 2px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header .subtitle {
            color: rgba(255, 182, 193, 0.6);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* ===== الفاصل المزخرف ===== */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 25px;
        }
        .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 182, 193, 0.3), transparent);
        }
        .divider .diamond {
            color: #ffb6c1;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* ===== الرسالة ===== */
        .message-container {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0 25px;
        }
        .message {
            font-size: 1.3rem;
            line-height: 2.2;
            color: rgba(255, 240, 245, 0.9);
            font-weight: 300;
            text-align: center;
            direction: rtl;
        }
        .message .highlight {
            color: #ffb6c1;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.2);
        }
        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: #ffb6c1;
            margin-right: 4px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== الأزرار ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 25px 0 10px;
        }
        .btn {
            font-family: 'Tajawal', sans-serif;
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffb6c1, #ff6b8a);
            color: #0a0610;
            box-shadow: 0 6px 30px rgba(255, 107, 138, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(255, 107, 138, 0.5);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 182, 193, 0.7);
            border: 1px solid rgba(255, 182, 193, 0.15);
            backdrop-filter: blur(5px);
        }
        .btn-secondary:hover {
            background: rgba(255, 182, 193, 0.1);
            color: #ffb6c1;
            border-color: rgba(255, 182, 193, 0.3);
            transform: translateY(-3px);
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.7s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== التذييل ===== */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 182, 193, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer .signature {
            color: rgba(255, 182, 193, 0.4);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .footer .signature strong {
            color: rgba(255, 182, 193, 0.6);
            font-weight: 700;
        }
        .footer .badge {
            display: flex;
            gap: 6px;
            color: rgba(255, 182, 193, 0.15);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        /* ===== الألعاب النارية ===== */
        .firework {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }
        .firework-particle {
            position: absolute;
            border-radius: 50%;
            animation: fireworkBurst 1.5s ease-out forwards;
        }
        @keyframes fireworkBurst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* ===== شاشة التحميل ===== */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0610;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }
        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-text {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffb6c1, #ff6b8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseText 1.2s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* ===== التوافق ===== */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; border-radius: 30px; }
            .header h1 { font-size: 2rem; }
            .message { font-size: 1.1rem; }
            .btn { padding: 12px 24px; font-size: 0.9rem; }
            .header .emoji-deco { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة التحميل ===== -->
    <div class="loader" id="loader">
        <span class="loader-text">✨ جاري التجهيز...</span>
    </div>

    <!-- ===== الخلفية ===== -->
    <div class="bg-canvas"></div>

    <!-- ===== النجوم ===== -->
    <div class="stars" id="stars"></div>

    <!-- ===== البطاقة ===== -->
    <div class="card" id="card">
        <div class="header">
            <span class="emoji-deco">🎂</span>
            <h1>عيد سعيد يا ليلى</h1>
            <div class="subtitle">✦ يومٌ استثنائي لملاك استثنائي ✦</div>
        </div>

        <div class="divider">
            <span class="line"></span>
            <span class="diamond">◆</span>
            <span class="line"></span>
        </div>

        <div class="message-container">
            <div class="message" id="message">
                <span class="highlight">🌸</span> كل سنة وإنتِ أجمل<br />
                <span class="highlight">💖</span> وأقرب لقلبي<br />
                <span class="highlight">🌺</span> وأكثر شخص أتمنى له السعادة
                <span class="cursor-blink"></span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="fireworkBtn">🎇 ألعاب نارية</button>
            <button class="btn btn-secondary" id="surpriseBtn">💫 مفاجأة</button>
        </div>

        <div class="footer">
            <span class="signature">— من شخص <strong>يحبك</strong> بصدق</span>
            <span class="badge">✦ ✦ ✦</span>
        </div>
    </div>

    <script>
        // =======================================================================
        // 1. شاشة التحميل
        // =======================================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 800);
        });

        // =======================================================================
        // 2. النجوم
        // =======================================================================
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // =======================================================================
        // 3. الشهب
        // =======================================================================
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            const x = Math.random() * 70 + 10;
            const y = Math.random() * 30 + 5;
            star.style.left = x + '%';
            star.style.top = y + '%';
            const angle = Math.random() * 30 + 20;
            star.style.setProperty('--angle', angle + 'deg');
            star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 4000);
        }
        setInterval(createShootingStar, 4000);
        setTimeout(createShootingStar, 500);

        // =======================================================================
        // 4. الألعاب النارية
        // =======================================================================
        function createFirework(x, y) {
            const colors = ['#ffb6c1', '#ff6b8a', '#ffd700', '#ff8a9b', '#ff4d6d', '#ffb3c6', '#ff99aa'];
            const container = document.createElement('div');
            container.className = 'firework';
            container.style.left = x + 'px';
            container.style.top = y + 'px';
            const particles = 45;

            for (let i = 0; i < particles; i++) {
                const p = document.createElement('div');
                p.className = 'firework-particle';
                const size = 4 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * 2 * Math.PI;
                const distance = 80 + Math.random() * 180;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                p.style.setProperty('--tx', tx + 'px');
                p.style.setProperty('--ty', ty + 'px');
                p.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
                p.style.animationDelay = (Math.random() * 0.3) + 's';
                p.style.boxShadow = `0 0 ${size * 2}px ${p.style.background}40`;
                container.appendChild(p);
            }

            document.body.appendChild(container);
            setTimeout(() => container.remove(), 2500);
        }

        function triggerFireworks(count = 1) {
            for (let f = 0; f < count; f++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.6 + 50;
                    createFirework(x, y);
                }, f * 300);
            }
        }

        // =======================================================================
        // 5. زر الألعاب النارية
        // =======================================================================
        document.getElementById('fireworkBtn').addEventListener('click', function(e) {
            // تأثير موجة على الزر
            const rect = this.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);

            // إطلاق ألعاب نارية مكثفة
            triggerFireworks(6);

            // إطلاق إضافي بعد ثانية
            setTimeout(() => triggerFireworks(4), 1000);
            setTimeout(() => triggerFireworks(3), 2000);
        });

        // =======================================================================
        // 6. زر المفاجأة
        // =======================================================================
        document.getElementById('surpriseBtn').addEventListener('click', function() {
            const messages = [
                '🌹 أنتِ مصدر إلهامي',
                '💫 وجودك في حياتي نعمة',
                '🌸 يومك أجمل من كل الأيام',
                '✨ أتمنى لكِ كل الحب',
                '🎀 أنتِ تستحقين العالم',
                '💖 قلبي يفرح بكِ',
                '🌺 أنتِ أجمل هدية في حياتي'
            ];
            const msg = messages[Math.floor(Math.random() * messages.length)];

            // عرض رسالة منبثقة جميلة (بديل عن alert)
            const oldMsg = document.querySelector('.message');
            const newMsg = document.createElement('div');
            newMsg.className = 'message';
            newMsg.style.animation = 'none';
            newMsg.innerHTML = `<span class="highlight">✨</span> ${msg} <span class="highlight">✨</span>`;
            newMsg.style.opacity = '0';
            newMsg.style.transform = 'scale(0.8)';
            newMsg.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

            const container = document.querySelector('.message-container');
            container.appendChild(newMsg);

            // اختفاء الرسالة القديمة
            oldMsg.style.transition = 'all 0.4s ease';
            oldMsg.style.opacity = '0';
            oldMsg.style.transform = 'scale(0.9)';

            setTimeout(() => {
                oldMsg.style.display = 'none';
                newMsg.style.opacity = '1';
                newMsg.style.transform = 'scale(1)';
            }, 400);

            // إعادة الرسالة الأصلية بعد 3 ثواني
            setTimeout(() => {
                newMsg.style.opacity = '0';
                newMsg.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    newMsg.remove();
                    oldMsg.style.display = '';
                    setTimeout(() => {
                        oldMsg.style.opacity = '1';
                        oldMsg.style.transform = 'scale(1)';
                    }, 50);
                }, 400);
            }, 3000);

            // ألعاب نارية خفيفة مع المفاجأة
            triggerFireworks(3);
        });

        // =======================================================================
        // 7. تأثير الكتابة التلقائي (اختياري)
        // =======================================================================
        // النص موجود مسبقاً، نضيف له تأثير وميض المؤشر فقط

        // =======================================================================
        // 8. ألعاب نارية تلقائية عند فتح الصفحة
        // =======================================================================
        setTimeout(() => {
            triggerFireworks(4);
        }, 1200);
        setTimeout(() => {
            triggerFireworks(3);
        }, 2500);

        // =======================================================================
        // 9. مؤثر إضافي: تحريك البطاقة مع حركة الماوس (Parallax خفيف)
        // =======================================================================
        document.addEventListener('mousemove', (e) => {
            const card = document.getElementById('card');
            const x = (e.clientX / window.innerWidth - 0.5) * 4;
            const y = (e.clientY / window.innerHeight - 0.5) * 4;
            card.style.transform =
                `rotateY(${x}deg) rotateX(${-y}deg) translateY(${-Math.abs(y) * 0.5}px)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.getElementById('card');
            card.style.transform = 'rotateY(0deg) rotateX(0deg) translateY(0px)';
        });

        // =======================================================================
        // 10. كونسول ترحيبي
        // =======================================================================
        console.log('%c🌸 كل عام وأنتِ بألف خير يا ليلى 🌸', 'font-size:22px; color:#ffb6c1; font-weight:bold;');
        console.log('%c❤️ هذه الصفحة صنعت خصيصاً لكِ ❤️', 'font-size:16px; color:#ff8a9b;');
    </script>
</body>
    </html>
