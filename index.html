<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎉 عيد ميلاد ليلى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: white;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        // ================================================================
        //  1. الإعدادات الأساسية
        // ================================================================
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ================================================================
        //  2. أدوات الرسم المساعدة
        // ================================================================
        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawText(txt, x, y, size, color, align = 'center') {
            ctx.font = `${size}px Arial, sans-serif`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.fillText(txt, x, y);
        }

        // ================================================================
        //  3. رسم الشخصيات (نسخ مبسطة شبيهة بالأنمي)
        // ================================================================

        // ----- 3.1 لايت ياغامي -----
        function drawLight(x, y, scale = 1) {
            const s = scale;
            // الوجه (بيضاوي)
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(s, s);

            // شعر أسود
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(0, -40, 50, 60, 0, 0, Math.PI * 2);
            ctx.fill();
            // خصلات
            ctx.fillRect(-45, -70, 20, 40);
            ctx.fillRect(25, -70, 20, 40);

            // بشرة
            ctx.fillStyle = '#f5e6d3';
            ctx.beginPath();
            ctx.ellipse(0, 10, 40, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            // عيون حادة
            ctx.fillStyle = '#2c1810';
            ctx.fillRect(-25, -5, 15, 6);
            ctx.fillRect(10, -5, 15, 6);
            // نظرة ثاقبة (نقط بيضاء)
            ctx.fillStyle = 'white';
            drawCircle(-18, -3, 2.5, 'white');
            drawCircle(17, -3, 2.5, 'white');

            // حاجبين
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-30, -18);
            ctx.lineTo(-10, -22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(30, -18);
            ctx.lineTo(10, -22);
            ctx.stroke();

            // فم (خط مستقيم)
            ctx.strokeStyle = '#8b5a4a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10, 18);
            ctx.lineTo(10, 18);
            ctx.stroke();

            ctx.restore();
        }

        // ----- 3.2 ميامورا إيزومي (هاوريما) -----
        function drawMiyamura(x, y, scale = 1) {
            const s = scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(s, s);

            // شعر بني فاتح
            ctx.fillStyle = '#b8956a';
            ctx.beginPath();
            ctx.ellipse(0, -35, 48, 55, 0, 0, Math.PI * 2);
            ctx.fill();
            // غرة جانبية
            ctx.fillRect(-40, -60, 15, 45);
            ctx.fillRect(25, -60, 15, 45);

            // بشرة
            ctx.fillStyle = '#fce8d5';
            ctx.beginPath();
            ctx.ellipse(0, 15, 38, 48, 0, 0, Math.PI * 2);
            ctx.fill();

            // عيون دافئة (كبيرة)
            ctx.fillStyle = '#4a3728';
            ctx.beginPath();
            ctx.ellipse(-18, 2, 10, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(18, 2, 10, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            // بريق
            ctx.fillStyle = 'white';
            drawCircle(-15, -2, 3, 'white');
            drawCircle(21, -2, 3, 'white');

            // ابتسامة خفيفة
            ctx.strokeStyle = '#b37b5e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 20, 12, 0.1, Math.PI - 0.1);
            ctx.stroke();

            ctx.restore();
        }

        // ----- 3.3 نيمار (نسخة أنمي) -----
        function drawNeymar(x, y, scale = 1) {
            const s = scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(s, s);

            // شعر (ضفائر صغيرة)
            ctx.fillStyle = '#2c1810';
            ctx.beginPath();
            ctx.ellipse(0, -38, 50, 55, 0, 0, Math.PI * 2);
            ctx.fill();
            // ضفائر جانبية
            ctx.fillRect(-50, -50, 15, 30);
            ctx.fillRect(35, -50, 15, 30);

            // بشرة (سمراء)
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.ellipse(0, 12, 42, 52, 0, 0, Math.PI * 2);
            ctx.fill();

            // عيون
            ctx.fillStyle = '#2c1810';
            ctx.fillRect(-22, -2, 12, 6);
            ctx.fillRect(10, -2, 12, 6);
            ctx.fillStyle = 'white';
            drawCircle(-17, 0, 2.5, 'white');
            drawCircle(15, 0, 2.5, 'white');

            // ابتسامة عريضة
            ctx.strokeStyle = '#8b5a4a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 22, 16, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // كرة قدم بجانبه
            ctx.fillStyle = '#222';
            drawCircle(55, 30, 18, '#222');
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(55, 30, 18, 0, Math.PI * 2);
            ctx.stroke();
            // خطوط الكرة
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(55, 30);
                ctx.lineTo(55 + Math.cos(angle) * 18, 30 + Math.sin(angle) * 18);
                ctx.stroke();
            }

            ctx.restore();
        }

        // ================================================================
        //  4. رسم الخلفيات والمشاهد
        // ================================================================

        let scene = 0; // 0: أبيض, 1: لايت, 2: ميامورا, 3: نيمار, 4: انفجار, 5: حفلة, 6: نهاية
        let timer = 0;
        let frame = 0;
        let particles = [];
        let showText = '';

        // ================================================================
        //  5. مشاهد القصة (تسلسل الأحداث)
        // ================================================================

        function drawScene() {
            ctx.clearRect(0, 0, W, H);

            // ---- المشهد 0: فراغ أبيض ----
            if (scene === 0) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, W, H);
                // بعد 1.5 ثانية يبدأ المشهد الأول
                if (frame > 90) {
                    scene = 1;
                    frame = 0;
                }
            }

            // ---- المشهد 1: لايت يدخل ----
            else if (scene === 1) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, W, H);

                // لايت يظهر كبيراً ثم يتراجع
                let scale = 1 + (1 - Math.min(frame / 30, 1)) * 0.5;
                let x = W / 2;
                let y = H / 2 + 20;

                // إذا مر وقت كافٍ يتحرك للخلف
                if (frame > 60) {
                    scale = 0.8;
                    y = H / 2 - 30;
                }

                drawLight(x, y, scale * 0.8);

                // حوار لايت
                if (frame < 30) {
                    drawText('"هل رأى أحدكم ريوك؟"', W / 2, H - 80, 28, '#333');
                } else if (frame < 80) {
                    drawText('"ليلى؟ اليوم عيد ميلادك؟"', W / 2, H - 80, 32, '#c0392b');
                } else if (frame < 130) {
                    drawText('"كدت أنسى أمرك يا محظوظة!"', W / 2, H - 80, 30, '#c0392b');
                } else if (frame < 180) {
                    drawText('"عيد ميلاد سعيد!"', W / 2, H - 80, 38, '#e67e22');
                } else {
                    // بعد 180 إطار ينتقل للمشهد التالي
                    if (frame > 200) {
                        scene = 2;
                        frame = 0;
                    }
                }
            }

            // ---- المشهد 2: ميامورا يسقط ----
            else if (scene === 2) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, W, H);

                // ميامورا يسقط من الأعلى
                let y = -100 + Math.min(frame * 6, H / 2 + 20);
                if (frame > 60) y = H / 2 + 20;
                drawMiyamura(W / 2, y, 0.7);

                // حوار ميامورا
                if (frame < 30) {
                    drawText('"أوخ... مؤلم!"', W / 2, H - 100, 28, '#333');
                } else if (frame < 80) {
                    drawText('"أها... ليلى."', W / 2, H - 100, 30, '#2980b9');
                } else if (frame < 130) {
                    drawText('"أهلاً بكِ... عيد ميلاد سعيد."', W / 2, H - 100, 28, '#2980b9');
                } else {
                    if (frame > 160) {
                        scene = 3;
                        frame = 0;
                    }
                }
            }

            // ---- المشهد 3: نيمار والكرة ----
            else if (scene === 3) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, W, H);

                // ميامورا واقف
                drawMiyamura(W / 2 - 120, H / 2 + 20, 0.6);

                // نيمار يدخل من اليمين
                let xN = W + 50 - Math.min(frame * 8, 300);
                if (frame > 40) xN = W / 2 + 120;
                drawNeymar(xN, H / 2 + 20, 0.7);

                // الكرة تضرب ميامورا
                if (frame > 30 && frame < 50) {
                    drawCircle(W / 2 - 80, H / 2 - 20, 20, '#222');
                }

                // حوارات
                if (frame < 20) {
                    drawText('"من الفاعل؟"', W / 2 - 120, H / 2 - 100, 26, '#c0392b');
                } else if (frame < 60) {
                    drawText('"آسف! تهت في الطريق!"', xN, H / 2 - 100, 26, '#333');
                } else if (frame < 110) {
                    drawText('"ليلى! أنا هنا!"', xN, H / 2 - 100, 34, '#e67e22');
                } else if (frame < 160) {
                    drawText('"🎉 حفلة؟ ممتاز... حفلة ليلى هنا!"', W / 2, H - 80, 30, '#27ae60');
                } else {
                    if (frame > 190) {
                        scene = 4;
                        frame = 0;
                        // توليد جزيئات الانفجار
                        for (let i = 0; i < 80; i++) {
                            particles.push({
                                x: W / 2,
                                y: H / 2,
                                vx: (Math.random() - 0.5) * 15,
                                vy: (Math.random() - 0.5) * 15,
                                r: Math.random() * 8 + 4,
                                color: `hsl(${Math.random() * 360}, 80%, 60%)`,
                                life: 1,
                            });
                        }
                    }
                }
            }

            // ---- المشهد 4: انفجار المكعب ----
            else if (scene === 4) {
                ctx.fillStyle = '#1a0a1a';
                ctx.fillRect(0, 0, W, H);

                // رسم الجزيئات
                let allDead = true;
                for (let p of particles) {
                    if (p.life > 0) {
                        allDead = false;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2;
                        p.life -= 0.01;
                        ctx.globalAlpha = p.life;
                        drawCircle(p.x, p.y, p.r * p.life, p.color);
                        ctx.globalAlpha = 1;
                    }
                }

                if (allDead && frame > 60) {
                    scene = 5;
                    frame = 0;
                    // توليد زينة الحفلة
                    for (let i = 0; i < 40; i++) {
                        particles.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2 - 1,
                            r: Math.random() * 6 + 3,
                            color: `hsl(${Math.random() * 360}, 80%, 70%)`,
                            life: 1,
                        });
                    }
                }

                drawText('💥', W / 2, H / 2, 80, 'white');
            }

            // ---- المشهد 5: الحفلة ----
            else if (scene === 5) {
                // خلفية الحفلة
                const grad = ctx.createLinearGradient(0, 0, W, H);
                grad.addColorStop(0, '#1a0a2e');
                grad.addColorStop(1, '#2d1b3d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // طاولة
                ctx.fillStyle = '#3d2b1f';
                ctx.fillRect(W / 2 - 150, H / 2 + 40, 300, 20);
                ctx.fillRect(W / 2 - 120, H / 2 + 20, 240, 20);

                // كعكة
                ctx.fillStyle = '#f5cba7';
                ctx.beginPath();
                ctx.ellipse(W / 2, H / 2 + 10, 60, 30, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(W / 2 - 30, H / 2 - 10, 60, 15);
                // شموع
                for (let i = -1; i <= 1; i++) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(W / 2 + i * 20 - 3, H / 2 - 30, 6, 20);
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.arc(W / 2 + i * 20, H / 2 - 32, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // بالونات
                for (let i = 0; i < 12; i++) {
                    ctx.fillStyle = `hsl(${i * 30}, 80%, 70%)`;
                    ctx.beginPath();
                    ctx.ellipse(50 + i * 60, 60 + Math.sin(i + frame * 0.02) * 20, 25, 35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(50 + i * 60, 95 + Math.sin(i + frame * 0.02) * 20);
                    ctx.lineTo(50 + i * 60, 140 + Math.sin(i + frame * 0.02) * 20);
                    ctx.stroke();
                }

                // الشخصيات في الحفلة
                drawLight(W / 2 - 200, H / 2 - 60, 0.5);
                drawMiyamura(W / 2 + 200, H / 2 - 60, 0.5);
                drawNeymar(W / 2 + 20, H / 2 - 80, 0.5);

                // نصوص الأغنية
                if (frame < 80) {
                    drawText('🎵 عيد ميلاد سعيد...', W / 2, 120, 36, '#f1c40f');
                } else if (frame < 160) {
                    drawText('🎵 عيد ميلاد سعيد ليلى...', W / 2, 120, 40, '#f1c40f');
                } else {
                    drawText('🎉 ليلى... دايماً ابقي مبتسمة! 🌸', W / 2, 120, 38, '#ff6b6b');

                    // ظهور الجملة الأخيرة
                    if (frame > 200) {
                        drawText('😉 واشكري صاحب الفكرة', W / 2, H - 60, 28, 'rgba(255,255,255,0.4)');
                        drawText('⭐ من فارس... لليلى ⭐', W / 2, H - 20, 24, 'rgba(255,255,255,0.2)');
                    }
                }

                // جزيئات متحركة
                for (let p of particles) {
                    if (p.life > 0) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.02;
                        p.life -= 0.002;
                        drawCircle(p.x, p.y, p.r * p.life, p.color);
                    }
                }
            }

            // ---- نهاية المشهد (إعادة التشغيل التلقائي) ----
            if (scene === 5 && frame > 360) {
                // إعادة التشغيل بعد دقيقة
                // location.reload();
            }

            frame++;
            requestAnimationFrame(drawScene);
        }

        // ================================================================
        //  6. بدء التشغيل
        // ================================================================
        drawScene();

        // صيانة: في حال توقف المشهد بسبب خطأ
        console.log('🎉 عيد ميلاد سعيد ليلى!');
        console.log('⭐ من فارس... بكل حب');
    </script>
</body>
</html>
