<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ليلى</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@300;400;600&family=Tajawal:wght@200;300;400&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #070408;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ===== السماء ===== */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(80, 40, 70, 0.15), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(60, 30, 80, 0.08), transparent 50%),
                #070408;
        }

        /* ===== النجوم المتكاسلة ===== */
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: floatStar linear infinite;
            opacity: 0;
        }

        @keyframes floatStar {
            0% { opacity: 0; transform: translate(0, 0) scale(0.3); }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); }
        }

        /* ===== الكلمات ===== */
        .words {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            padding: 30px 25px;
            text-align: center;
            direction: rtl;
        }

        .word {
            font-weight: 200;
            letter-spacing: 3px;
            line-height: 2;
            opacity: 0;
            animation: wordAppear 4s ease forwards;
        }

        .word:nth-child(1) {
            animation-delay: 0.5s;
            font-size: 3.8rem;
            font-family: 'Dancing Script', cursive;
            color: rgba(235, 200, 220, 0.12);
            letter-spacing: 8px;
        }

        .word:nth-child(2) {
            animation-delay: 3s;
            font-size: 1.4rem;
            color: rgba(210, 170, 200, 0.06);
            letter-spacing: 12px;
            margin-top: 30px;
        }

        .word:nth-child(3) {
            animation-delay: 6s;
            font-size: 1.8rem;
            font-family: 'Dancing Script', cursive;
            color: rgba(210, 170, 200, 0.05);
            letter-spacing: 6px;
            margin-top: 40px;
        }

        .word:nth-child(4) {
            animation-delay: 9s;
            font-size: 1rem;
            color: rgba(200, 160, 190, 0.03);
            letter-spacing: 10px;
            margin-top: 30px;
            font-weight: 200;
        }

        @keyframes wordAppear {
            0% { opacity: 0; transform: translateY(20px); }
            20% { opacity: 0.6; transform: translateY(0); }
            80% { opacity: 0.6; }
            100% { opacity: 0.1; transform: translateY(-10px); }
        }

        /* ===== لا شيء آخر ===== */
        .nothing {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.005);
            font-size: 0.4rem;
            letter-spacing: 15px;
            font-family: 'Georgia', serif;
            z-index: 0;
            animation: nothingFade 20s ease 12s forwards;
        }

        @keyframes nothingFade {
            0% { opacity: 0; }
            100% { opacity: 0.2; }
        }

        /* ===== خط صغير يظهر أخيراً ===== */
        .whisper {
            position: fixed;
            bottom: 50px;
            right: 30px;
            z-index: 1;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: rgba(200, 150, 180, 0.015);
            letter-spacing: 4px;
            opacity: 0;
            animation: whisperAppear 10s ease 14s forwards;
        }

        @keyframes whisperAppear {
            0% { opacity: 0; transform: translateX(10px); }
            100% { opacity: 0.06; transform: translateX(0); }
        }

        /* ===== توافق ===== */
        @media (max-width: 420px) {
            .word:nth-child(1) { font-size: 2.8rem; }
            .word:nth-child(2) { font-size: 1.1rem; }
            .word:nth-child(3) { font-size: 1.4rem; }
            .whisper { font-size: 1.4rem; bottom: 30px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- السماء -->
    <div class="sky" id="sky"></div>

    <!-- الكلمات -->
    <div class="words">
        <div class="word">ليلى</div>
        <div class="word">عيد ميلادك</div>
        <div class="word">ما أقدر أقول أكثر</div>
        <div class="word">وأكثر شخص أتمنى له الخير</div>
    </div>

    <!-- همسة أخيرة -->
    <div class="whisper">من فارس</div>

    <!-- لا شيء -->
    <div class="nothing">· · ·</div>

    <script>
        // ============================================================
        // نجوم متكاسلة
        // ============================================================
        function createLazyStars() {
            const sky = document.getElementById('sky');
            const count = 140;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                const dx = (Math.random() - 0.5) * 250;
                const dy = (Math.random() - 0.5) * 250;
                star.style.setProperty('--dx', dx + 'px');
                star.style.setProperty('--dy', dy + 'px');

                star.style.animationDuration = (15 + Math.random() * 25) + 's';
                star.style.animationDelay = (Math.random() * 20) + 's';

                star.style.background = `rgba(255, ${200 + Math.random() * 55}, ${210 + Math.random() * 45}, 0.4)`;
                star.style.boxShadow = `0 0 ${size * 2}px rgba(255, 182, 193, 0.03)`;

                sky.appendChild(star);
            }
        }

        createLazyStars();

        // ============================================================
        // كونسول
        // ============================================================
        console.log('%cليلى', 'font-size:40px; color:#b88a9a; font-weight:100; letter-spacing:15px;');
        console.log('%cعيد ميلادك', 'font-size:18px; color:#b88a9a; font-weight:100; letter-spacing:8px; opacity:0.4;');
        console.log('%c...', 'font-size:12px; color:#b88a9a; opacity:0.2;');
    </script>

</body>
</html>
